[package]
name = "p304m-prometheus-exporter"
edition = "2021"

[dependencies]
tapo = "0.8"
tokio = { version = "1.52.1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
prometheus-client = "0.24.1"
prometheus-client-derive-encode = "0.5.0"
axum = "0.8.9"
tower = "0.5.3"
clap = { version = "4.6.1", features = ["derive", "env"] }
clap_complete = "4.6.3"
async-trait = "0.1.89"

# Disable default-tls as it wants openssl installed
reqwest = { version = "0.13.3", features = ["http2", "charset", "hickory-dns", "system-proxy"], default-features = false }

[dev-dependencies]
http-body-util = "0.1.3"
